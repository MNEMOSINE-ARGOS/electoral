<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Escala de competitividad desde el partido de enfoque: gana con bastión, ventaja, competitiva o reñida; pierde reñida, al alcance, desventaja o adversa">
<text x="260.0" y="26" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0E71AF">◀ GANA</text>
<text x="740.0" y="26" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#D81B60">PIERDE ▶</text>
<rect x="20.0" y="44" width="117.0" height="52" rx="10" fill="#1e3a5f"/>
<text x="78.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">≥ 20 pts</text>
<text x="78.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#3b5b86">Bastión</text>
<rect x="140.0" y="44" width="117.0" height="52" rx="10" fill="#0e71af"/>
<text x="198.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">10–20 pts</text>
<text x="198.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0e71af">Ventaja</text>
<rect x="260.0" y="44" width="117.0" height="52" rx="10" fill="#5fa8d3"/>
<text x="318.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">5–10 pts</text>
<text x="318.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#5fa8d3">Competitiva</text>
<rect x="380.0" y="44" width="117.0" height="52" rx="10" fill="#d97706"/>
<text x="438.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">&lt; 5 pts</text>
<text x="438.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#d97706">Reñida</text>
<rect x="500.0" y="44" width="117.0" height="52" rx="10" fill="#e0557f"/>
<text x="558.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">&lt; 5 pts</text>
<text x="558.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#e0557f">Reñida</text>
<rect x="620.0" y="44" width="117.0" height="52" rx="10" fill="#c2185b"/>
<text x="678.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">5–10 pts</text>
<text x="678.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2185b">Al alcance</text>
<rect x="740.0" y="44" width="117.0" height="52" rx="10" fill="#9c1450"/>
<text x="798.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">10–20 pts</text>
<text x="798.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#9c1450">Desventaja</text>
<rect x="860.0" y="44" width="117.0" height="52" rx="10" fill="#5b0f2e"/>
<text x="918.5" y="77" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">≥ 20 pts</text>
<text x="918.5" y="124" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#a3245a">Adversa</text>
<line x1="498.5" y1="36" x2="498.5" y2="104" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
<text x="500.0" y="156" text-anchor="middle" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="13" fill="#8A94A6">Margen de la candidatura del partido frente a la mejor rival, en puntos porcentuales</text>
</svg>